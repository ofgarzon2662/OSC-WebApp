<div class="create-artifact-container">
  <header class="header">
    <h1>Update Artifact ✏️</h1>
    <div class="header-divider"></div>
  </header>

  <!-- Artifact update form -->
  <form [formGroup]="artifactForm" (ngSubmit)="onSubmit()" class="artifact-form">
    <div class="form-grid">
      <!-- Left Column -->
      <div class="left-column">
        <div class="form-group">
          <label for="title" class="field-label">Title</label>
          <input 
            id="title"
            type="text"
            formControlName="title"
            class="form-control"
            [readonly]="true" [disabled]="true"
          >
        </div>

        <div class="form-group">
          <label for="description" class="field-label">Description</label>
          <textarea 
            id="description"
            formControlName="description"
            class="form-control"
            rows="4"
            [readonly]="true" [disabled]="true"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="keywords" class="field-label">Key Words</label>
          <input 
            id="keywords"
            type="text"
            formControlName="keywords"
            class="form-control"
            placeholder="Enter keywords, separated by commas"
          >
        </div>

        <div class="form-group">
          <label for="links" class="field-label">Links of interest</label>
          <input 
            id="links"
            type="text"
            formControlName="links"
            class="form-control"
            placeholder="Enter URLs, separated by commas"
          >
        </div>

        <div class="form-group last-field">
          <label for="doi" class="field-label">DOI</label>
          <input 
            id="doi"
            type="text"
            formControlName="doi"
            class="form-control"
            placeholder="ex. DOI: 10.1234/abc123"
          >
        </div>
      </div>

      <!-- Right Column -->
      <div class="right-column">
        <div class="form-group">
          <label for="fundingAgencies" class="field-label">Funding Agencies</label>
          <div id="fundingAgencies" class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nsf">
              NSF
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nih">
              NIH
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="noaa">
              NOAA
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nasa">
              NASA
            </label>
          </div>
          <div class="other-agency">
            <label for="otherAgency">Other:</label>
            <input 
              id="otherAgency"
              type="text"
              formControlName="otherAgency"
              class="form-control"
              placeholder="Enter agencies, separated by commas"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="acknowledgment" class="field-label">Acknowledgment</label>
          <textarea 
            id="acknowledgment"
            formControlName="acknowledgment"
            class="form-control"
            rows="4"
          ></textarea>
        </div>
      </div>
    </div>
  </form>

  <div class="file-upload-divider"></div>

  <!-- Current Manifest -->
  <div class="manifest-section mt-5" *ngIf="artifact?.manifest?.length">
    <h4 class="section-heading mb-3">Current Manifest</h4>
    <p class="small text-muted">{{ artifact?.manifest?.length }} files total, showing only 10</p>
    <div class="table-responsive">
      <table class="table table-sm manifest-table align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col">Filename</th>
            <th scope="col">Hash</th>
            <th scope="col">Alg.</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of artifact?.manifest | slice:0:10">
            <td class="filename">{{ item.filename }}</td>
            <td class="hash text-truncate">{{ item.hash }}</td>
            <td class="algorithm">{{ item.algorithm }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Footprint below Manifest -->
  <div *ngIf="artifact?.footprint" class="mt-2">
    <div class="section-heading mb-2">Footprint (SHA-256)</div>
    <code class="text-break">{{ artifact?.footprint }}</code>
  </div>
  </div>

  

  <!-- File upload section (same as create-artifact) -->
  <div class="file-upload-divider"></div>

  <app-file-upload-section
    [isProcessing]="isProcessing"
    [selectedFilesData]="selectedFilesData"
    [processingMessage]="processingMessage"
    [footprintPreview]="footprintPreview"
    [uploadError]="uploadError"
    [errorMessage]="errorMessage"
    [isDragging]="isDragging"
    [hintText]="'Have updates for your artifact? Drag a new file or folder here to regenerate the manifest.'"
    (dragOver)="onDragOver($event)"
    (dragLeave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (selectFolder)="selectFolder()"
    (selectFile)="selectFile()"
    (resetUpload)="resetUpload()"
  ></app-file-upload-section>

  <!-- Navigation Buttons -->
  <div class="form-navigation">
    <button type="button" class="btn btn-secondary" (click)="goBack()">
      Cancel and Go Back
    </button>
    <button 
      type="button"
      class="btn btn-primary" 
      [disabled]="!isFormAndFileValid() || isSubmitting || lastCreatedId"
      (click)="onSubmit()"
    >
      Update
    </button>
    <a *ngIf="lastCreatedId" class="btn btn-success" [routerLink]="['/artifacts', lastCreatedId]">Check your modified artifact</a>
  </div>

  <!-- Hidden file inputs -->
  <input #fileInput type="file" style="display: none" (change)="handleFileSelection($event)">
  <input #folderInput type="file" webkitdirectory style="display: none" (change)="handleFileSelection($event)">
</div>

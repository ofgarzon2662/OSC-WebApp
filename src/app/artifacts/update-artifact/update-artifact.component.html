<div class="create-artifact-container">
  <header class="header">
    <h1>Update Artifact ✏️</h1>
    <div class="header-divider"></div>
  </header>

  <!-- Artifact update form -->
  <form [formGroup]="artifactForm" (ngSubmit)="onSubmit()" class="artifact-form">
    <app-artifact-metadata-form [artifactForm]="artifactForm" [isUpdateMode]="true"></app-artifact-metadata-form>
  </form>

  <div class="file-upload-divider"></div>

  <!-- Current Manifest -->
  <div class="manifest-section mt-5" *ngIf="artifact?.manifest?.length">
    <h4 class="section-heading mb-3">Current Manifest</h4>
    <p class="small text-muted">{{ artifact?.manifest?.length }} files total, showing only 10</p>
    <div class="table-responsive">
      <table class="table table-sm manifest-table align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col">Filename</th>
            <th scope="col">Hash</th>
            <th scope="col">Alg.</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of artifact?.manifest | slice:0:10">
            <td class="filename">{{ item.filename }}</td>
            <td class="hash text-truncate">{{ item.hash }}</td>
            <td class="algorithm">{{ item.algorithm }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Footprint below Manifest -->
  <div *ngIf="artifact?.footprint" class="mt-2">
    <div class="section-heading mb-2">Footprint (SHA-256)</div>
    <code class="text-break">{{ artifact?.footprint }}</code>
  </div>
  </div>

  

  <!-- File upload section (same as create-artifact) -->
  <div class="file-upload-divider"></div>

  <app-file-upload-section
    [isProcessing]="isProcessing"
    [selectedFilesData]="selectedFilesData"
    [processingMessage]="processingMessage"
    [footprintPreview]="footprintPreview"
    [uploadError]="uploadError"
    [errorMessage]="errorMessage"
    [isDragging]="isDragging"
    [hintText]="'Have updates for your artifact? Drag a new file or folder here to regenerate the manifest.'"
    [keepManifestUnchanged]="keepManifestUnchanged"
    [showKeepManifestToggle]="true"
    (keepManifestToggle)="onToggleKeepManifest($event)"
    (fileDragOver)="onDragOver($event)"
    (fileDragLeave)="onDragLeave($event)"
    (fileDrop)="onDrop($event)"
    (selectFolder)="selectFolder()"
    (selectFile)="selectFile()"
    (resetUpload)="resetUpload()"
  ></app-file-upload-section>

  <!-- Navigation Buttons -->
  <div class="form-navigation">
    <button type="button" class="btn btn-secondary" (click)="goBack()">
      Cancel and Go Back
    </button>
    <button 
      type="button"
      class="btn btn-primary" 
      [disabled]="!isFormAndFileValid() || isSubmitting || lastCreatedId"
      (click)="onSubmit()"
    >
      Update
    </button>
    <a *ngIf="lastCreatedId" class="btn btn-success" [routerLink]="['/artifacts', lastCreatedId]">Check your modified artifact</a>
  </div>

  <!-- Hidden file inputs -->
  <input #fileInput type="file" style="display: none" (change)="handleFileSelection($event)">
  <input #folderInput type="file" webkitdirectory style="display: none" (change)="handleFileSelection($event)">
</div>

<div class="create-artifact-container">
  <header class="header">
    <h1>Add a New Artifact to your Org's Vault! 🚀</h1>
    <div class="header-divider"></div>
  </header>

  <form [formGroup]="artifactForm" (ngSubmit)="onSubmit()" class="artifact-form">
    <div class="form-grid">
      <!-- Left Column -->
      <div class="left-column">
        <div class="form-group">
          <label for="title" class="field-label">Title</label>
          <input 
            id="title"
            type="text"
            formControlName="title"
            class="form-control"
          >
        </div>

        <div class="form-group">
          <label for="description" class="field-label">Description</label>
          <textarea 
            id="description"
            formControlName="description"
            class="form-control"
            rows="4"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="keywords" class="field-label">Key Words</label>
          <input 
            id="keywords"
            type="text"
            formControlName="keywords"
            class="form-control"
            placeholder="Enter keywords, separated by commas"
          >
        </div>

        <div class="form-group">
          <label for="links" class="field-label">Links of interest</label>
          <input 
            id="links"
            type="text"
            formControlName="links"
            class="form-control"
          >
          <small class="helper-text">Please, add valid links only</small>
        </div>

        <div class="form-group">
          <label for="doi" class="field-label">DOI</label>
          <input 
            id="doi"
            type="text"
            formControlName="doi"
            class="form-control"
          >
          <small class="helper-text">Please, add a valid DOI only</small>
        </div>
      </div>

      <!-- Right Column -->
      <div class="right-column">
        <div class="form-group">
          <label class="field-label">Funding Agencies</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nsf">
              NSF
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nih">
              NIH
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="noaa">
              NOAA
            </label>
            <label class="checkbox-label">
              <input type="checkbox" formControlName="nasa">
              NASA
            </label>
          </div>
          <div class="other-agency">
            <label for="otherAgency">Other:</label>
            <input 
              id="otherAgency"
              type="text"
              formControlName="otherAgency"
              class="form-control"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="acknowledgment" class="field-label">Acknowledgment</label>
          <textarea 
            id="acknowledgment"
            formControlName="acknowledgment"
            class="form-control"
            rows="4"
          ></textarea>
        </div>
      </div>
    </div>
  </form>
</div>

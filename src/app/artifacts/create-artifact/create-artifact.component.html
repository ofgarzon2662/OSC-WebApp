<div class="create-artifact-container">
  <header class="header">
    <h1>Add a New Artifact to your Org's Vault! 🚀</h1>
    <div class="header-divider"></div>
  </header>

  <form [formGroup]="artifactForm" (ngSubmit)="onSubmit()" class="artifact-form">
    <app-artifact-metadata-form [artifactForm]="artifactForm"></app-artifact-metadata-form>
  </form>

  <div class="file-upload-divider"></div>

  <app-file-upload-section
    [isProcessing]="isProcessing"
    [selectedFilesData]="selectedFilesData"
    [processingMessage]="processingMessage"
    [footprintPreview]="footprintPreview"
    [uploadError]="uploadError"
    [errorMessage]="errorMessage"
    [isDragging]="isDragging"
    (fileDragOver)="onDragOver($event)"
    (fileDragLeave)="onDragLeave($event)"
    (fileDrop)="onDrop($event)"
    (selectFolder)="selectFolder()"
    (selectFile)="selectFile()"
    (resetUpload)="resetUpload(); lastCreatedId = null; isSubmitted = false;"
  ></app-file-upload-section>

  <!-- Navigation Buttons -->
  <div class="form-navigation">
    <button type="button" class="btn btn-secondary" (click)="goBack()">
      Cancel and Go Back
    </button>
    <button 
      data-cy="submit-btn"
      type="button"
      class="btn btn-primary" 
      [disabled]="!isFormAndFileValid() || isProcessing || isSubmitting || lastCreatedId"
      (click)="onSubmit()"
    >
      Submit
    </button>
    <a *ngIf="lastCreatedId" class="btn btn-success" [routerLink]="['/artifacts', lastCreatedId]">View new artifact here</a>
  </div>

  <!-- Hidden file inputs -->
  <input #fileInput type="file" style="display: none" (change)="handleFileSelection($event)">
  <input #folderInput type="file" webkitdirectory style="display: none" (change)="handleFileSelection($event)">
</div>

<div class="card artifact-card shadow-sm">
  <div class="card-header">
    {{ workflow.name.length > 20 ? (workflow.name | slice:0:20) + '...' : workflow.name }}
  </div>
  <div class="card-body d-flex flex-column">
    <h6 class="card-subtitle mb-2 text-muted">Description:</h6>
    <p class="card-text">{{ workflow.description.length > 60 ? (workflow.description | slice:0:60) + '...' : workflow.description }}</p>

    <h6 class="card-subtitle mb-2 text-muted">Updates:</h6>
    <p class="card-text">Last Updated at {{ workflow.lastUpdated | date:'medium' }}</p>

    <div class="mt-auto button-container">
      <a class="btn btn-primary view-button" [routerLink]="['/workflows', workflow.id]">View</a>
    </div>
  </div>
</div>

<div class="row mb-5">
  <div class="col-12 d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title">Artifacts</h2>
    <a routerLink="/list-artifacts" class="view-all-link">VIEW ALL</a>
  </div>

  <div class="col-12">
    <div *ngIf="artifacts.length > 0; else noArtifacts">
      <div class="row justify-content-center">
        <div class="col-md-4 mb-4 d-flex justify-content-center" *ngFor="let artifact of artifacts">
          <app-artifact-card [artifact]="artifact"></app-artifact-card>
        </div>
      </div>
    </div>
    <ng-template #noArtifacts>
      <div class="no-content-message">
        <p>No artifacts have been created yet. Be the first to contribute!</p>
      </div>
    </ng-template>
  </div>
</div>

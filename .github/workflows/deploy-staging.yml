name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: webapp-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy portal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm run build:production
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::269624229733:role/osc-github-deploy-webapp
          aws-region: us-west-2
      - name: Publish immutable build output
        run: aws s3 sync dist/osc-web-app/browser/ s3://${{ vars.WEBAPP_S3_BUCKET }}/ --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.WEBAPP_CF_DISTRIBUTION_ID }} --paths "/*"

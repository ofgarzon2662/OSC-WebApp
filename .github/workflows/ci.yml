name: CI

on:
  push:
    branches: [master, develop, 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - name: Check changed source files
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git merge-base HEAD origin/master 2>/dev/null || git rev-parse HEAD^)"
          fi
          mapfile -t formatted < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'src/**/*.ts' 'src/**/*.html' 'src/**/*.css' 'src/**/*.scss' 'cypress/**/*.ts')
          mapfile -t linted < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'src/**/*.ts' 'cypress/**/*.ts')
          if [ "${#formatted[@]}" -gt 0 ]; then
            npx prettier --check "${formatted[@]}"
          fi
          if [ "${#linted[@]}" -gt 0 ]; then
            npx eslint "${linted[@]}"
          fi
      - name: Unit tests with coverage
        run: npm run test:ci
      - name: Production build
        run: npm run build:production
      - name: WCAG accessibility checks
        run: npm run test:a11y
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webapp-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

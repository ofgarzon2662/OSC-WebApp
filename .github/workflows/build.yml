# .github/workflows/build.yml
# ──────────────────────────────────────────────────────────────
# CI pipeline with SonarCloud analysis (fixed JDK + pinned action)
# ──────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [ master, develop, 'feature**' ]
  pull_request:
    branches: [ master, develop ]   # ensure PRs to these branches are analysed
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout sources
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Node.js for Angular build/tests (pin to major version, not a patch)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'          # LTS / valid semver for the action

    # 3. Project dependencies
    - name: Install dependencies
      run: npm ci                  # faster & reproducible

    # 4. Run unit tests + coverage
    - name: Run tests with coverage
      run: npx ng test --no-watch --browsers=ChromeHeadless --code-coverage

    # 5. Set up JDK 17 so the scanner re-uses it instead of auto-downloading one
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    
    - name: Check SONAR_TOKEN present
      run: echo "Token length: ${#SONAR_TOKEN}"
      shell: bash
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 6. SonarCloud analysis
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2   # pinned version
      env:
        GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN:       ${{ secrets.SONAR_TOKEN }}
        # Force the scanner to skip JRE auto-provisioning and use the Java we installed
        SONAR_SCANNER_OPTS: -Dsonar.scanner.skipJreProvisioning=true
      with:
        args: >
          -Dsonar.branch.name=${{ github.ref_name }}
          -Dsonar.cpd.exclusions=**/*.spec.ts
# .github/workflows/build.yml
# ──────────────────────────────────────────────────────────────
# CI pipeline with SonarCloud analysis (fixed JDK + pinned action)
# ──────────────────────────────────────────────────────────────
name: Build

on:
  push:
    branches: [ master, develop, 'feature**' ]
  pull_request:
    branches: [ master, develop ]         # ensure PRs to these branches are analysed
    types:   [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1 – Checkout sources
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # 2 – Node.js for Angular build/tests
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'              # LTS / valid semver for the action

      # 3 – Install dependencies
      - name: Install dependencies
        run: npm ci                       # faster & reproducible

      # 4 – Run unit tests + coverage
      - name: Run tests with coverage
        run: npx ng test --no-watch --browsers=ChromeHeadless --code-coverage

      # 5 – Set up JDK 17 so the scanner re-uses it
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Debug – verify SONAR_TOKEN is available
      - name: Check SONAR_TOKEN present
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Token length: ${#SONAR_TOKEN}"

      # 6 – SonarCloud analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:       ${{ secrets.SONAR_TOKEN }}
          # Force the scanner to use the JDK we installed
          SONAR_SCANNER_OPTS: -Dsonar.scanner.skipJreProvisioning=true
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.cpd.exclusions=**/*.spec.ts

  deploy:
    name: Deploy to S3
    needs: [sonarcloud]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269624229733:role/osc-github-deploy-webapp
          aws-region: us-west-2

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ vars.WEBAPP_S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.WEBAPP_CF_DISTRIBUTION_ID }} \
            --paths "/*"